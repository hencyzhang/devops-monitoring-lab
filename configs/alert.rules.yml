groups:
  - name: node-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '实例 {{ $labels.instance }} 已宕机'
      - alert: HighCPU
        expr: 100 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'CPU 使用率过高：{{ $value | humanize }}%'
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '磁盘使用率超过 90%'
