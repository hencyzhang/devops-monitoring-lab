name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask psycopg2-binary pika prometheus-client

      - name: Check Python syntax
        run: |
          python -m py_compile ecommerce/backend/app.py
          python -m py_compile ecommerce/backend/notify_worker.py
          python -m py_compile ecommerce/backend/logging_config.py

      - name: Check Docker Compose config
        run: |
          docker compose -f ecommerce/docker-compose.yml config
